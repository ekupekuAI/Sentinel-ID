<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">SentinelID</title>
  <desc id="desc">Identity trust scoring, AI explanations and a tamper-evident audit ledger for security operations teams.</desc>
  <defs>
    <radialGradient id="glowA" cx="15%" cy="0%" r="70%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="100%" r="60%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.25" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="0.75" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="titleClip">
      <text x="240" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-1">SentinelID</text>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <style>
    .fade { animation: rise 900ms cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: 150ms; } .d2 { animation-delay: 350ms; } .d3 { animation-delay: 550ms; }
    .shift { animation: shift 9s linear infinite; }
    .pulse { transform-origin: 140px 160px; animation: pulse 3.2s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    .arc { stroke-dasharray: 330 440; animation: draw 1.6s 400ms cubic-bezier(.16,1,.3,1) both; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes shift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .8; transform: scale(1.08); } }
    @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(340px); } }
    @keyframes draw { from { stroke-dasharray: 0 440; } to { stroke-dasharray: 330 440; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .shift, .pulse, .scan, .arc, .blink { animation: none !important; }
      .scan { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#070a12"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect class="scan" y="0" width="1200" height="120" fill="url(#scan)"/>

    <!-- shield mark -->
    <g class="fade">
      <circle class="pulse" cx="140" cy="160" r="66" fill="#3b82f6" opacity=".35" filter="url(#soft)"/>
      <rect x="86" y="106" width="108" height="108" rx="26" fill="#2563eb"/>
      <rect x="86" y="106" width="108" height="108" rx="26" fill="none" stroke="#93c5fd" stroke-opacity=".35"/>
      <path d="M140 128 L166 138 V160 C166 178 154 190 140 196 C126 190 114 178 114 160 V138 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <path d="M128 160 L137 169 L154 151" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- animated gradient title -->
    <g clip-path="url(#titleClip)" class="fade d1">
      <rect class="shift" x="0" y="80" width="1800" height="120" fill="url(#titleFill)"/>
    </g>
    <text class="fade d2" x="244" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#94a3b8">Should this identity be trusted? Answered in one score.</text>
    <text class="fade d3" x="244" y="252" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="15" letter-spacing="2" fill="#60a5fa">TRUST SCORING · AI EXPLANATIONS · SECURECHAIN AUDIT LEDGER</text>

    <!-- trust gauge illustration -->
    <g transform="translate(1010 160)"><g class="fade d2">
      <circle r="70" fill="none" stroke="#1e293b" stroke-width="12" stroke-dasharray="330 440" stroke-linecap="round" transform="rotate(135)"/>
      <circle class="arc" r="70" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" transform="rotate(135)"/>
      <text y="10" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">0–100</text>
      <text y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#94a3b8">TRUST SCORE</text>
      <g transform="translate(-44 74)">
        <circle class="blink" cx="6" cy="6" r="5" fill="#34d399"/>
        <text x="18" y="11" font-family="Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#34d399">ALLOW</text>
      </g>
    </g></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".15"/>
</svg>
